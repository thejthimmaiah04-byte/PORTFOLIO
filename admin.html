<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A1712">
<title>Portfolio Admin</title>
<style>
:root{
  --bg:#0A1712;--panel:#10241C;--panel2:#142A21;--line:#24382E;
  --accent:#FF5A00;--white:#fff;--grey:#9AA1A8;--dim:#8A8F94;
  --r:14px;--hdr:56px;--nav:64px;
  --face:"Jost","Futura",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--grey);font-family:var(--face);overflow:hidden}
body{display:flex;flex-direction:column}

/* header */
header{
  height:var(--hdr);flex-shrink:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);
}
#hdrBack{visibility:hidden;background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:10px;min-width:44px;line-height:1}
#hdrTitle{font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--white)}
#hdrSave{visibility:hidden;background:none;border:none;color:var(--accent);font-family:var(--face);font-size:13px;font-weight:600;letter-spacing:.06em;cursor:pointer;padding:10px;min-width:44px}

/* screens */
main{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.screen.active{display:block}

/* bottom nav */
nav{height:var(--nav);flex-shrink:0;display:flex;background:var(--panel);border-top:1px solid var(--line)}
nav button{
  flex:1;background:none;border:none;color:var(--dim);
  font-family:var(--face);font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:color .2s;
}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--accent)}

/* list */
.list{padding:16px;display:flex;flex-direction:column;gap:10px;padding-bottom:96px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;
  transition:border-color .2s;
}
.card:active{border-color:var(--accent)}
.thumb{
  width:52px;height:52px;border-radius:8px;flex-shrink:0;
  background:var(--panel2);overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--line);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:500;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-top:5px}
.badge.complete{background:rgba(0,200,80,.12);color:#00c864}
.badge.coming-soon{background:rgba(255,90,0,.12);color:var(--accent)}
.chevron{color:var(--line);font-size:20px;flex-shrink:0}

/* FAB */
.fab{
  position:fixed;bottom:calc(var(--nav) + 18px);right:18px;
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:30px;line-height:1;
  cursor:pointer;box-shadow:0 6px 24px rgba(255,90,0,.4);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;z-index:50;
}
.fab:active{transform:scale(.92)}

/* form */
.form{padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:60px}

.img-pick{
  width:100%;aspect-ratio:16/9;border-radius:var(--r);
  background:var(--panel);border:2px dashed var(--line);
  position:relative;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
}
.img-pick.sq{aspect-ratio:1}
.img-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.img-pick .pick-lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:1;pointer-events:none}
.img-pick .pick-ico{font-size:30px;color:var(--line);z-index:1;pointer-events:none}
.img-pick .pick-change{
  position:absolute;bottom:10px;right:10px;z-index:2;
  background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:20px;
  padding:5px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  display:none;pointer-events:none;
}
.img-pick.has-img .pick-lbl,.img-pick.has-img .pick-ico{display:none}
.img-pick.has-img .pick-change{display:block}
.img-pick input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;width:100%;height:100%}

.lbl{display:block;font-size:9px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
input[type=text],textarea,select{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--white);font-family:var(--face);font-size:14px;padding:12px 14px;
  width:100%;outline:none;resize:vertical;-webkit-appearance:none;appearance:none;
}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}

/* tags */
.tags-wrap{display:flex;flex-wrap:wrap;gap:8px;min-height:32px}
.t-chip{
  display:flex;align-items:center;gap:5px;
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:4px 10px;font-size:11px;color:var(--white);
}
.t-chip button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.tag-row{display:flex;gap:8px;margin-top:8px}
.tag-row input{flex:1}
.tag-row button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--accent);font-size:22px;padding:0 14px;cursor:pointer;flex-shrink:0;line-height:1}

/* status radio */
.radio-row{display:flex;gap:8px}
.radio-opt{
  flex:1;padding:12px 8px;border-radius:10px;border:1px solid var(--line);
  text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;color:var(--grey);transition:all .2s;
}
.radio-opt.sel{border-color:var(--accent);color:var(--accent);background:rgba(255,90,0,.08)}

/* section labels */
.slabel{font-size:9px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.sdivider{height:1px;background:var(--line)}

/* buttons */
.del-btn{
  background:none;border:1px solid rgba(220,60,50,.25);border-radius:10px;
  color:#dc3c32;font-family:var(--face);font-size:13px;
  padding:14px;cursor:pointer;width:100%;margin-top:4px;transition:background .2s;
}
.del-btn:active{background:rgba(220,60,50,.1)}
.primary-btn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  font-family:var(--face);font-size:13px;font-weight:600;letter-spacing:.08em;
  padding:16px;cursor:pointer;width:100%;transition:opacity .2s;
}
.primary-btn:active{opacity:.8}

/* about photo grid */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ps-lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;display:block}

/* empty state */
.empty{text-align:center;padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-ico{font-size:40px}
.empty p{font-size:13px;color:var(--dim);line-height:1.7}

/* toast */
#toast{
  position:fixed;bottom:calc(var(--nav) + 14px);left:50%;
  transform:translateX(-50%) translateY(10px);opacity:0;
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:10px 20px;font-size:12px;color:var(--white);
  transition:all .3s;white-space:nowrap;pointer-events:none;z-index:200;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <button id="hdrBack" onclick="App.back()">&#8592;</button>
  <span id="hdrTitle">Projects</span>
  <button id="hdrSave" onclick="App.save()">Save</button>
</header>

<main>

<!-- ── Projects list ── -->
<section class="screen active" id="s-projects">
  <div class="list" id="projectsList"></div>
  <button class="fab" onclick="App.newItem('project')">+</button>
</section>

<!-- ── Project edit ── -->
<section class="screen" id="s-project-edit">
<div class="form">
  <div class="img-pick" id="pImgPick">
    <div class="pick-ico">&#128444;</div>
    <span class="pick-lbl">Tap to add image</span>
    <span class="pick-change">Change image</span>
    <img id="pImgPreview" alt="" style="display:none">
    <input type="file" accept="image/*" id="pImgFile" onchange="App.onImg('project')">
  </div>
  <label>
    <span class="lbl">Project name</span>
    <input type="text" id="pName" placeholder="The Mantis">
  </label>
  <div>
    <span class="lbl">Tags</span>
    <div class="tags-wrap" id="pTagsWrap"></div>
    <div class="tag-row">
      <input type="text" id="pTagInput" placeholder="e.g. 3D Modelling" onkeydown="if(event.key==='Enter'){App.addTag();event.preventDefault()}">
      <button onclick="App.addTag()">+</button>
    </div>
  </div>
  <label>
    <span class="lbl">Blurb</span>
    <textarea id="pBlurb" rows="3" placeholder="One or two sentences about this project."></textarea>
  </label>
  <div>
    <span class="lbl">Status</span>
    <div class="radio-row">
      <div class="radio-opt sel" id="rs-coming-soon" onclick="App.setStatus('coming-soon')">Coming Soon</div>
      <div class="radio-opt" id="rs-complete" onclick="App.setStatus('complete')">Complete</div>
    </div>
  </div>
  <label id="pLinkWrap" style="display:none">
    <span class="lbl">Project page filename</span>
    <input type="text" id="pLink" placeholder="project-mantis.html">
  </label>
  <button class="del-btn" id="pDelBtn" onclick="App.deleteItem('project')" style="display:none">Delete Project</button>
</div>
</section>

<!-- ── Field notes list ── -->
<section class="screen" id="s-notes">
  <div class="list" id="notesList"></div>
  <button class="fab" onclick="App.newItem('note')">+</button>
</section>

<!-- ── Note edit ── -->
<section class="screen" id="s-note-edit">
<div class="form">
  <div class="img-pick" id="nImgPick">
    <div class="pick-ico">&#128247;</div>
    <span class="pick-lbl">Tap to add photo</span>
    <span class="pick-change">Change photo</span>
    <img id="nImgPreview" alt="" style="display:none">
    <input type="file" accept="image/*" capture="environment" id="nImgFile" onchange="App.onImg('note')">
  </div>
  <label>
    <span class="lbl">Title</span>
    <input type="text" id="nTitle" placeholder="What you observed">
  </label>
  <label>
    <span class="lbl">Entry</span>
    <textarea id="nText" rows="6" placeholder="What you saw, what you learned, why it mattered."></textarea>
  </label>
  <button class="del-btn" id="nDelBtn" onclick="App.deleteItem('note')" style="display:none">Delete Entry</button>
</div>
</section>

<!-- ── About ── -->
<section class="screen" id="s-about">
<div class="form">
  <span class="slabel">Photos</span>
  <div class="photo-grid">
    <div>
      <span class="ps-lbl">Profile</span>
      <div class="img-pick sq" id="aPhotoPickEl">
        <div class="pick-ico">&#128100;</div>
        <span class="pick-lbl">Tap to add</span>
        <span class="pick-change">Change</span>
        <img id="aPhotoPreview" alt="" style="display:none">
        <input type="file" accept="image/*" id="aPhotoFile" onchange="App.onImg('aPhoto')">
      </div>
    </div>
    <div>
      <span class="ps-lbl">Fieldwork</span>
      <div class="img-pick sq" id="aFieldPickEl">
        <div class="pick-ico">&#127807;</div>
        <span class="pick-lbl">Tap to add</span>
        <span class="pick-change">Change</span>
        <img id="aFieldPreview" alt="" style="display:none">
        <input type="file" accept="image/*" id="aFieldFile" onchange="App.onImg('aField')">
      </div>
    </div>
  </div>
  <div class="sdivider"></div>
  <span class="slabel">Bio</span>
  <label><span class="lbl">Paragraph 1</span><textarea id="bio1" rows="3"></textarea></label>
  <label><span class="lbl">Paragraph 2</span><textarea id="bio2" rows="3"></textarea></label>
  <label><span class="lbl">Paragraph 3</span><textarea id="bio3" rows="3"></textarea></label>
  <button class="primary-btn" onclick="App.saveAbout()">Save About</button>
</div>
</section>

</main>

<nav>
  <button id="tab-projects" class="active" onclick="App.tab('projects')">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    Projects
  </button>
  <button id="tab-notes" onclick="App.tab('notes')">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    Notes
  </button>
  <button id="tab-about" onclick="App.tab('about')">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    About
  </button>
</nav>

<div id="toast"></div>

<script>
const App = (() => {
  const $ = id => document.getElementById(id);

  const S = {
    cur: 'projects',
    scr: 'projects',
    data: null,
    editId: null,
    tags: [],
    status: 'coming-soon',
    imgs: {},
  };

  // ── API ──────────────────────────────────────────────────────────────────
  const api = async (method, url, body) => {
    const opts = { method };
    if (body) { opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  };

  const upload = async file => {
    const fd = new FormData();
    fd.append('image', file);
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    if (!r.ok) throw new Error('Upload failed');
    return (await r.json()).url;
  };

  // ── Screens ──────────────────────────────────────────────────────────────
  const show = scr => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $('s-' + scr).classList.add('active');
    S.scr = scr;
    const isEdit = scr.includes('edit');
    $('hdrBack').style.visibility = (isEdit || scr === 'about') ? 'visible' : 'hidden';
    $('hdrSave').style.visibility = isEdit ? 'visible' : 'hidden';
    const names = {
      'projects': 'Projects',
      'project-edit': S.editId ? 'Edit Project' : 'New Project',
      'notes': 'Field Notes',
      'note-edit': S.editId ? 'Edit Entry' : 'New Entry',
      'about': 'About',
    };
    $('hdrTitle').textContent = names[scr] || '';
  };

  const tab = t => {
    S.cur = t;
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    $('tab-' + t).classList.add('active');
    if (t === 'projects') { renderProjects(); show('projects'); }
    else if (t === 'notes') { renderNotes(); show('notes'); }
    else if (t === 'about') { loadAbout(); show('about'); }
  };

  const back = () => { S.imgs = {}; tab(S.cur); };

  // ── Image pickers ────────────────────────────────────────────────────────
  const setImg = (pickId, prevId, url) => {
    const pick = $(pickId), prev = $(prevId);
    if (url) { prev.src = url; prev.style.display = 'block'; pick.classList.add('has-img'); }
    else { prev.src = ''; prev.style.display = 'none'; pick.classList.remove('has-img'); }
  };

  const onImg = slot => {
    const ids = { project:'pImgFile', note:'nImgFile', aPhoto:'aPhotoFile', aField:'aFieldFile' };
    const file = $(ids[slot]).files[0];
    if (!file) return;
    S.imgs[slot] = file;
    const reader = new FileReader();
    reader.onload = e => {
      if (slot === 'project') setImg('pImgPick', 'pImgPreview', e.target.result);
      else if (slot === 'note') setImg('nImgPick', 'nImgPreview', e.target.result);
      else if (slot === 'aPhoto') setImg('aPhotoPickEl', 'aPhotoPreview', e.target.result);
      else if (slot === 'aField') setImg('aFieldPickEl', 'aFieldPreview', e.target.result);
    };
    reader.readAsDataURL(file);
  };

  // ── Projects ─────────────────────────────────────────────────────────────
  const renderProjects = () => {
    const list = $('projectsList');
    const items = S.data?.projects || [];
    if (!items.length) {
      list.innerHTML = `<div class="empty"><div class="empty-ico">&#128193;</div><p>No projects yet.<br>Tap <b>+</b> to add one.</p></div>`;
      return;
    }
    list.innerHTML = items.map(p => `
      <div class="card" onclick="App.editItem('project','${p.id}')">
        <div class="thumb">${p.image ? `<img src="${p.image}" alt="">` : '&#128444;'}</div>
        <div class="card-info">
          <div class="card-name">${p.name || 'Untitled'}</div>
          <div class="card-sub">${(p.tags || []).join(' · ') || 'No tags'}</div>
          <span class="badge ${p.status || 'coming-soon'}">${p.status === 'complete' ? 'Complete' : 'Coming Soon'}</span>
        </div>
        <span class="chevron">&#8250;</span>
      </div>`).join('');
  };

  const newItem = type => {
    S.editId = null; S.imgs = {};
    if (type === 'project') {
      S.tags = []; S.status = 'coming-soon';
      $('pName').value = ''; $('pBlurb').value = ''; $('pLink').value = ''; $('pTagInput').value = '';
      renderTags(); setStatus('coming-soon');
      setImg('pImgPick', 'pImgPreview', null);
      $('pDelBtn').style.display = 'none';
      show('project-edit');
    } else {
      $('nTitle').value = ''; $('nText').value = '';
      setImg('nImgPick', 'nImgPreview', null);
      $('nDelBtn').style.display = 'none';
      show('note-edit');
    }
  };

  const editItem = (type, id) => {
    S.editId = id; S.imgs = {};
    if (type === 'project') {
      const p = S.data.projects.find(x => x.id === id); if (!p) return;
      S.tags = [...(p.tags || [])]; S.status = p.status || 'coming-soon';
      $('pName').value = p.name || '';
      $('pBlurb').value = p.blurb || '';
      $('pLink').value = p.link || '';
      renderTags(); setStatus(S.status);
      setImg('pImgPick', 'pImgPreview', p.image || null);
      $('pDelBtn').style.display = 'block';
      show('project-edit');
    } else {
      const n = S.data.fieldNotes.find(x => x.id === id); if (!n) return;
      $('nTitle').value = n.title || '';
      $('nText').value = n.text || '';
      setImg('nImgPick', 'nImgPreview', n.image || null);
      $('nDelBtn').style.display = 'block';
      show('note-edit');
    }
  };

  // ── Tags ─────────────────────────────────────────────────────────────────
  const renderTags = () => {
    $('pTagsWrap').innerHTML = S.tags.map((t, i) =>
      `<span class="t-chip">${t}<button onclick="App.removeTag(${i})">&#215;</button></span>`
    ).join('');
  };
  const addTag = () => {
    const v = $('pTagInput').value.trim();
    if (v && !S.tags.includes(v)) { S.tags.push(v); renderTags(); }
    $('pTagInput').value = '';
  };
  const removeTag = i => { S.tags.splice(i, 1); renderTags(); };

  // ── Status ───────────────────────────────────────────────────────────────
  const setStatus = v => {
    S.status = v;
    $('rs-coming-soon').classList.toggle('sel', v === 'coming-soon');
    $('rs-complete').classList.toggle('sel', v === 'complete');
    $('pLinkWrap').style.display = v === 'complete' ? 'block' : 'none';
  };

  // ── Save ─────────────────────────────────────────────────────────────────
  const save = async () => {
    const btn = $('hdrSave');
    btn.textContent = '...'; btn.style.pointerEvents = 'none';
    try {
      if (S.scr === 'project-edit') await saveProject();
      else if (S.scr === 'note-edit') await saveNote();
      S.data = await api('GET', '/api/content');
      toast('Saved');
      back();
    } catch (e) { toast('Error: ' + e.message); }
    finally { btn.textContent = 'Save'; btn.style.pointerEvents = ''; }
  };

  const saveProject = async () => {
    let img = S.editId ? (S.data.projects.find(p => p.id === S.editId)?.image || null) : null;
    if (S.imgs.project) img = await upload(S.imgs.project);
    const body = {
      name: $('pName').value.trim(),
      tags: S.tags,
      blurb: $('pBlurb').value.trim(),
      status: S.status,
      link: S.status === 'complete' ? ($('pLink').value.trim() || null) : null,
      image: img,
    };
    if (S.editId) await api('PUT', `/api/projects/${S.editId}`, body);
    else await api('POST', '/api/projects', body);
  };

  // ── Notes ────────────────────────────────────────────────────────────────
  const renderNotes = () => {
    const list = $('notesList');
    const items = S.data?.fieldNotes || [];
    if (!items.length) {
      list.innerHTML = `<div class="empty"><div class="empty-ico">&#128211;</div><p>No field notes yet.<br>Tap <b>+</b> to add one.</p></div>`;
      return;
    }
    list.innerHTML = items.map(n => `
      <div class="card" onclick="App.editItem('note','${n.id}')">
        <div class="thumb">${n.image ? `<img src="${n.image}" alt="">` : '&#128247;'}</div>
        <div class="card-info">
          <div class="card-name">${n.title || 'Untitled'}</div>
          <div class="card-sub">${(n.text || '').slice(0, 55)}${(n.text || '').length > 55 ? '...' : ''}</div>
        </div>
        <span class="chevron">&#8250;</span>
      </div>`).join('');
  };

  const saveNote = async () => {
    let img = S.editId ? (S.data.fieldNotes.find(n => n.id === S.editId)?.image || null) : null;
    if (S.imgs.note) img = await upload(S.imgs.note);
    const body = {
      title: $('nTitle').value.trim(),
      text: $('nText').value.trim(),
      image: img,
    };
    if (S.editId) await api('PUT', `/api/fieldnotes/${S.editId}`, body);
    else await api('POST', '/api/fieldnotes', body);
  };

  // ── Delete ───────────────────────────────────────────────────────────────
  const deleteItem = async type => {
    if (!S.editId) return;
    if (!confirm('Delete this? This cannot be undone.')) return;
    try {
      if (type === 'project') await api('DELETE', `/api/projects/${S.editId}`);
      else await api('DELETE', `/api/fieldnotes/${S.editId}`);
      S.data = await api('GET', '/api/content');
      toast('Deleted');
      back();
    } catch (e) { toast('Error: ' + e.message); }
  };

  // ── About ────────────────────────────────────────────────────────────────
  const loadAbout = () => {
    const a = S.data?.about || {};
    setImg('aPhotoPickEl', 'aPhotoPreview', a.photo || null);
    setImg('aFieldPickEl', 'aFieldPreview', a.fieldworkPhoto || null);
    const bio = a.bio || [];
    $('bio1').value = bio[0] || '';
    $('bio2').value = bio[1] || '';
    $('bio3').value = bio[2] || '';
  };

  const saveAbout = async () => {
    const btn = document.querySelector('#s-about .primary-btn');
    btn.textContent = '...'; btn.style.pointerEvents = 'none';
    try {
      let photo = S.data?.about?.photo || null;
      let field = S.data?.about?.fieldworkPhoto || null;
      if (S.imgs.aPhoto) photo = await upload(S.imgs.aPhoto);
      if (S.imgs.aField) field = await upload(S.imgs.aField);
      const bio = [$('bio1'), $('bio2'), $('bio3')].map(el => el.value.trim()).filter(Boolean);
      await api('PUT', '/api/about', { photo, fieldworkPhoto: field, bio: bio.length ? bio : null });
      S.data = await api('GET', '/api/content');
      S.imgs = {};
      toast('About saved');
    } catch (e) { toast('Error: ' + e.message); }
    finally { btn.textContent = 'Save About'; btn.style.pointerEvents = ''; }
  };

  // ── Toast ────────────────────────────────────────────────────────────────
  const toast = (msg, ms = 2400) => {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), ms);
  };

  // ── Init ─────────────────────────────────────────────────────────────────
  const init = async () => {
    try {
      S.data = await api('GET', '/api/content');
      renderProjects();
    } catch (e) {
      $('projectsList').innerHTML = `<div class="empty"><div class="empty-ico">&#9888;</div><p>Cannot reach server.<br>Make sure <code>node server.js</code> is running on this computer.</p></div>`;
    }
  };

  return { init, tab, back, save, newItem, editItem, addTag, removeTag, setStatus, onImg, deleteItem, saveAbout };
})();

App.init();
</script>
</body>
</html>
